name: Deploy BankLab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'banklab-payload/**'
      - 'index.html'
      - 'app.js'
      - 'questions.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unpack BankLab website payload
        shell: bash
        run: |
          if [ -d banklab-payload ]; then
            cat banklab-payload/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/banklab-site.zip
            unzip -oq /tmp/banklab-site.zip -d .
            rm -rf banklab-payload /tmp/banklab-site.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html app.js questions.js styles.css manifest.webmanifest sw.js .nojekyll
            if ! git diff --cached --quiet; then
              git commit -m "Add BankLab website files"
              git push origin HEAD:main
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website files
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
