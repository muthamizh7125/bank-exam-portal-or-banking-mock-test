name: Deploy BankLab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bank-exam-portal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload BankLab site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./bank-exam-portal

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
